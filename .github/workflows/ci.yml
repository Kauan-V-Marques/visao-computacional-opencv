name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Lint e formatacao (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes
        run: pytest -v

      - name: Gerar as demonstracoes
        run: python -m visao demo --pasta demo-ci
