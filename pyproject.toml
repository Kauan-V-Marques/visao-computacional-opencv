[project]
name = "visao-computacional"
version = "1.0.0"
description = "Rastreamento de objetos por cor e leitura de linha para robos seguidores, com OpenCV"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
demo = ["pillow>=10,<13"]
dev = ["pytest>=8,<9", "ruff>=0.8", "pillow>=10,<13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["visao*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
